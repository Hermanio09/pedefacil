services:
  evolution-api:
    # A organização no Docker Hub mudou de "atendai" para "evoapicloud" — a imagem antiga
    # (atendai/evolution-api) parou de aceitar pull anônimo (repositório privado/descontinuado).
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      # Só acessível de dentro do próprio servidor (127.0.0.1) — a aplicação Next.js roda na
      # mesma VPS e chama via localhost. Nunca exponha essa porta pra internet: quem tiver a
      # API key consegue mandar mensagem por qualquer número conectado.
      - "127.0.0.1:8080:8080"
    environment:
      # Chave forte gerada — ver credenciais-producao-NAO-COMMITAR.txt
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Tipo de autenticação
      - AUTHENTICATION_TYPE=apikey
      # Versões recentes exigem banco configurado (DATABASE_ENABLED=false sozinho não basta
      # mais) — usa o mesmo Postgres da aplicação principal, num banco "evolution" separado.
      # host.docker.internal aponta pro host da VPS (fora do container) via extra_hosts abaixo.
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      # Sem Redis nesta VPS — versões recentes tentam usar por padrão e ficam gerando erro de
      # "redis disconnected" sem parar, o que atrapalha o handshake de conexão do WhatsApp.
      # Cache local substitui sem problema pro nosso volume de uso.
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=false
      - STORE_CHATS=false
      # QR Code em base64
      - QRCODE_LIMIT=30
      # Logs
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
